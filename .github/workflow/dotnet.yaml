name: mydotnetproject

on:
  push:
    branches:
      - develop

jobs:
  dotnet-publish:
    runs-on: 'ubuntu-latest'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.100'
      - name: sonar cloud scan
        uses: sonar source /sonar cloud -github-actions@v6
        with:
          args: >
             -Dsonar.organization=noporg
             -Dsonar.projectKey=noporg_hemanth
        env:
              mysonar: ${{ secrets.SONAR_TOKEN }}
              mysonar_url: ${{ secrets.https://sonarcloud.io }}
      - name: Publish project
        run: dotnet publish -c release src/Presentation/Nop.Web/Nop.Web.csproj -o develop

  
      