name: mydotnetproject

on:
  push:
    branches:
      - develop

jobs:
  dotnet-publish:
    runs-on: 'ubuntu-latest'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.100'
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3

        with:
          args: >
             -Dsonar.organization=noporg
             -Dsonar.projectKey=noporg_hemanth
        env:
              SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              mysonar_url: https://sonarcloud.io
      - name: Publish project
        run: dotnet publish -c Release src/Presentation/Nop.Web/Nop.Web.csproj -o develop

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build Docker image
        env:
          ECR_REGISTRY: aws ecr get-login-password --region us-east-2| docker login --username AWS --password-stdin 503427799577.dkr.ecr.us-east-2.amazonaws.com/ecr/nop
          ECR_REPOSITORY: ecr/nop
          IMAGE_TAG: latest
        run: |
          docker build -t ecr/nop .
          docker tag ecr/nop:latest 503427799577.dkr.ecr.us-east-2.amazonaws.com/ecr/nop:latest
          docker push 503427799577.dkr.ecr.us-east-2.amazonaws.com/ecr/nop:latest
          

